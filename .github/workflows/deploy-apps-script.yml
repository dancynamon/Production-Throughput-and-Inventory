# Push Code.gs into the bound Apps Script project and cut a new web-app
# version, so the backend ships on a push to main exactly like the front end
# already does on Cloudflare.
#
# INERT UNTIL CONFIGURED. Without the secrets below it skips with a green tick
# rather than failing — an always-red workflow is worse than no workflow.
#
# One-time setup (about ten minutes, on your own machine):
#
#   1. Turn on the Apps Script API:  https://script.google.com/home/usersettings
#   2. npm i -g @google/clasp && clasp login
#   3. cat ~/.clasprc.json          -> repo secret  CLASP_CREDENTIALS
#   4. Open the Apps Script editor -> Project Settings -> copy the Script ID
#                                   -> repo secret  APPS_SCRIPT_ID
#   5. Deployment ID from Deploy > Manage deployments (starts AKfycb…)
#                                   -> repo secret  APPS_SCRIPT_DEPLOYMENT_ID
#
# Step 5 matters: passing the EXISTING deployment id updates that deployment in
# place. Omitting it mints a brand-new URL and leaves config.js pointing at the
# old one — the exact failure that cost several rounds of debugging by hand.

name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/Code.gs']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Names each missing secret rather than reporting a bare "not configured".
      # A gate that only says no turns every misconfiguration into a guessing
      # game, and the usual cause is a name typo or the Variables tab instead
      # of the Secrets tab — both of which this distinguishes at a glance.
      - name: Check whether this repo is configured for clasp
        id: gate
        env:
          CREDS: ${{ secrets.CLASP_CREDENTIALS }}
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          missing=""
          report () {
            if [ -z "$2" ]; then
              echo "  $1: MISSING"
              missing="$missing $1"
            else
              echo "  $1: present (${#2} chars)"
            fi
          }
          echo "Repository secrets visible to this workflow:"
          report CLASP_CREDENTIALS         "$CREDS"
          report APPS_SCRIPT_ID            "$SCRIPT_ID"
          report APPS_SCRIPT_DEPLOYMENT_ID "$DEPLOYMENT_ID"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing:$missing — skipping the deploy."
            echo ""
            echo "Check Settings > Secrets and variables > Actions:"
            echo "  * they must be under the SECRETS tab, not VARIABLES"
            echo "  * they must be REPOSITORY secrets, not environment secrets"
            echo "  * names are case-sensitive and must match exactly"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All three present — proceeding."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Run the test suite before touching production
        if: steps.gate.outputs.configured == 'true'
        run: |
          for t in overview count metrics wip strap today; do
            echo "--- test-$t ---"
            node "apps-script/test-$t.js"
          done

      - name: Install clasp and authenticate
        if: steps.gate.outputs.configured == 'true'
        run: |
          npm install -g @google/clasp
          printf '%s' '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' \
            '${{ secrets.APPS_SCRIPT_ID }}' > .clasp.json

      # clasp reports a bare "Unexpected non-whitespace character after JSON at
      # position N", which says nothing about which file or how to fix it. The
      # usual cause is copying from Terminal and catching the shell prompt on
      # the end of the paste. Deliberately reports only shape — length, brace
      # balance, final character — and never any content, since a fragment of a
      # credential file is still a credential.
      - name: Validate the credentials before using them
        if: steps.gate.outputs.configured == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const path = process.env.HOME + "/.clasprc.json";
            const raw = fs.readFileSync(path, "utf8");
            try {
              JSON.parse(raw);
              console.log(`clasprc.json parses cleanly (${raw.length} chars)`);
            } catch (e) {
              const t = raw.trimEnd();
              console.log(`::error::CLASP_CREDENTIALS is not valid JSON — ${e.message}`);
              console.log(`length ${raw.length}, opens ${(raw.match(/{/g)||[]).length}, closes ${(raw.match(/}/g)||[]).length}`);
              console.log(`last character is ${JSON.stringify(t.slice(-1))} — it should be "}"`);
              console.log("");
              console.log("Almost always the shell prompt copied along with the output.");
              console.log("On macOS re-copy it without touching the terminal selection:");
              console.log("    cat ~/.clasprc.json | pbcopy");
              console.log("then paste straight into the CLASP_CREDENTIALS secret.");
              process.exit(1);
            }'

      - name: Push and deploy
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          clasp push --force
          STAMP=$(grep -m1 -oP "BUILD:\s+\K[0-9-]+ [0-9:]+ UTC" apps-script/Code.gs || echo "manual")
          if [ -n "$DEPLOYMENT_ID" ]; then
            # Update the EXISTING deployment. Creating a new one would mint a
            # fresh /exec URL that config.js does not point at.
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$STAMP"
          else
            echo "::warning::APPS_SCRIPT_DEPLOYMENT_ID not set — pushed the code but did NOT deploy it."
            echo "::warning::The web app keeps serving the previous version until you deploy by hand."
          fi
